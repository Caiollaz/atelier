<!doctype html>
<!--
  Phone frame: a generic modern phone with a Dynamic Island, drawn in CSS.
  Puts a real screenshot (capture at 390x844, DPR 3) inside the screen, cropped from the top.

  Query params:
    img   path to the screenshot, relative to this file or an absolute file:/// URL
    sb    status bar color as hex, with or without "#" (default ffffff); sample it from the
          top pixels of the screenshot so the bar matches the page
    fg    status bar text and icon color as hex (default 111111; use ffffff on dark pages)
    time  status bar clock (default 9:41)

  Render to a transparent PNG (940x1880):
    google-chrome --headless=new --disable-gpu --hide-scrollbars --screenshot=phone.png \
      --window-size=470,940 --force-device-scale-factor=2 --default-background-color=00000000 \
      --virtual-time-budget=2000 "file:///abs/path/phone-frame.html?img=shot.png&sb=ffffff"
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone frame</title>
<style>
html, body { margin: 0; background: transparent; }
body { width: 470px; height: 940px; position: relative; overflow: hidden; }
.frame {
  position: absolute; left: 20px; top: 28px; width: 430px; height: 884px; border-radius: 66px;
  background: linear-gradient(160deg, #3b3b3d 0%, #1a1a1b 35%, #0c0c0c 70%, #2a2a2c 100%);
  box-shadow: 0 30px 70px rgba(0,0,0,.28), 0 8px 18px rgba(0,0,0,.18), inset 0 0 0 2px #56565a, inset 0 0 0 5px #0a0a0a;
}
.btn { position: absolute; width: 4px; background: #2c2c2e; border-radius: 2px; box-shadow: inset 0 0 0 1px #48484a; }
.b1 { left: 16px; top: 160px; height: 34px; }
.b2 { left: 16px; top: 225px; height: 66px; }
.b3 { left: 16px; top: 305px; height: 66px; }
.b4 { right: 16px; top: 250px; height: 104px; }
.screen { position: absolute; left: 40px; top: 48px; width: 390px; height: 844px; border-radius: 50px; overflow: hidden; background: #fff; }
.status {
  --fg: #111;
  position: absolute; left: 0; top: 0; width: 390px; height: 54px; background: #fff;
  display: flex; align-items: flex-end; justify-content: space-between; padding: 0 30px 6px 34px; box-sizing: border-box;
  font: 600 15px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--fg); z-index: 3;
}
.status .r { display: flex; align-items: center; gap: 6px; }
.bars { display: flex; align-items: flex-end; gap: 1.5px; height: 11px; }
.bars i { width: 3px; background: var(--fg); border-radius: 1px; display: block; }
.wifi { width: 15px; height: 11px; position: relative; }
.wifi::before { content: ""; position: absolute; left: 0; top: 0; width: 15px; height: 15px; border: 2.2px solid var(--fg); border-radius: 50%; clip-path: polygon(0 0, 100% 0, 50% 50%); }
.wifi::after { content: ""; position: absolute; left: 5.6px; top: 6.5px; width: 3.8px; height: 3.8px; background: var(--fg); border-radius: 50%; }
.bat { width: 25px; height: 12px; border: 1.5px solid var(--fg); border-radius: 4px; position: relative; box-sizing: border-box; }
.bat::after { content: ""; position: absolute; left: 1.5px; top: 1.5px; width: 16px; height: 6px; background: var(--fg); border-radius: 1.5px; }
.bat::before { content: ""; position: absolute; right: -4px; top: 3px; width: 2px; height: 4px; background: var(--fg); border-radius: 0 2px 2px 0; }
.island { position: absolute; left: 50%; top: 11px; width: 120px; height: 35px; margin-left: -60px; background: #000; border-radius: 20px; z-index: 4; }
.island::after { content: ""; position: absolute; right: 14px; top: 11px; width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #2b2f45, #05060a 70%); }
img.shot { position: absolute; left: 0; top: 54px; width: 390px; height: 790px; object-fit: cover; object-position: top; }
</style>
</head>
<body>
<div class="frame">
  <div class="btn b1"></div><div class="btn b2"></div><div class="btn b3"></div><div class="btn b4"></div>
</div>
<div class="screen">
  <div class="status" id="status">
    <span id="time">9:41</span>
    <span class="r">
      <span class="bars"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:11px"></i></span>
      <span class="wifi"></span>
      <span class="bat"></span>
    </span>
  </div>
  <div class="island"></div>
  <img class="shot" id="shot" alt="">
</div>
<script>
  const q = new URLSearchParams(location.search);
  const hex = (v) => (v ? '#' + v.replace(/^#/, '') : null);
  const status = document.getElementById('status');
  if (q.get('img')) document.getElementById('shot').src = q.get('img');
  if (q.get('sb')) { status.style.background = hex(q.get('sb')); document.querySelector('.screen').style.background = hex(q.get('sb')); }
  if (q.get('fg')) status.style.setProperty('--fg', hex(q.get('fg')));
  if (q.get('time')) document.getElementById('time').textContent = q.get('time');
</script>
</body>
</html>
